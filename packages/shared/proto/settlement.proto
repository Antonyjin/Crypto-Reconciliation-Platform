syntax = "proto3";
  package settlement;

  message CreateSettlementRequest {
      string trade_id = 1;
  }

  message UpdateStatusRequest {
      string id = 1;
      string status = 2;
      optional string failure_reason = 3;
  }

  message GetByStatusRequest {
      string status = 1;
  }

  message GetByTradeIdRequest {
      string trade_id = 1;
  }

  message SettlementResponse {
      string id = 1;
      string trade_id = 2;
      string status = 3;
      int32 retry_count = 4;
      int32 max_retries = 5;
      optional string failure_reason = 6;
      optional string settled_at = 7;
      string created_at = 8;
      string updated_at = 9;
  }

  message SettlementList {
      repeated SettlementResponse settlements = 1;
  }

  service SettlementService {
      rpc CreateSettlement(CreateSettlementRequest) returns (SettlementResponse);
      rpc UpdateSettlementStatus(UpdateStatusRequest) returns (SettlementResponse);
      rpc GetSettlementsByStatus(GetByStatusRequest) returns (SettlementList);
      rpc GetSettlementByTradeId(GetByTradeIdRequest) returns (SettlementResponse);
  }